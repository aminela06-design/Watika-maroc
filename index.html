<style>
  :root{
    --ink:#211C17;
    --ink-soft:#5C5349;
    --paper:#FAF6F0;
    --paper-alt:#F1E9DD;
    --line:#E2D6C3;
    --red:#B7282E;
    --red-deep:#8C1E23;
    --green:#0B5D3B;
    --green-soft:#E4F0E9;
    --amber:#946200;
    --amber-soft:#FBF0DC;
    --gray-soft:#EFEAE2;
    --radius:14px;
    --shadow:0 1px 2px rgba(33,28,23,.06), 0 6px 20px -8px rgba(33,28,23,.15);
    --maxw:640px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Cairo',system-ui,sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Reem Kufi','Cairo',sans-serif;
    font-weight:700;
    letter-spacing:0;
    margin:0;
  }
  a{color:inherit}
  button{font-family:inherit}
  button.card, button.opt, button.backbtn, button.btn{
    appearance:none; -webkit-appearance:none;
    font-size:inherit; width:100%; display:flex;
  }
  :focus-visible{outline:2.5px solid var(--red); outline-offset:2px}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

  /* ===== Header / Hero ===== */
  header.hero{
    background:
      radial-gradient(120% 160% at 15% -10%, #C6373D 0%, var(--red) 45%, var(--red-deep) 100%);
    color:#fff;
    padding:36px 0 44px;
    position:relative;
    overflow:hidden;
  }
  header.hero::after{
    content:"";
    position:absolute; inset:0;
    background-image:
      radial-gradient(circle at 92% 18%, rgba(255,255,255,.14) 0, transparent 40%),
      radial-gradient(circle at 8% 92%, rgba(255,255,255,.10) 0, transparent 45%);
    pointer-events:none;
  }
  .hero-inner{position:relative;z-index:1}
  .brand{
    display:flex;align-items:center;gap:10px;
    font-size:15px; opacity:.92; margin-bottom:22px;
  }
  .brand .star{color:var(--green);background:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px}
  header.hero h1{font-size:32px; line-height:1.35; margin-bottom:10px}
  header.hero p.tagline{font-size:16px; opacity:.9; max-width:34ch; margin:0}

  .searchbox{
    margin-top:26px;
    background:#fff;
    border-radius:999px;
    display:flex; align-items:center; gap:10px;
    padding:6px 6px 6px 18px;
    box-shadow:var(--shadow);
  }
  .searchbox input{
    flex:1; border:none; outline:none; background:transparent;
    font-family:'Cairo',sans-serif; font-size:15px; color:var(--ink);
    padding:10px 4px;
  }
  .searchbox input::placeholder{color:#9B8F7F}
  .searchbox .icon{font-size:16px; opacity:.55}

  /* ===== Sections ===== */
  main{padding:28px 0 60px}
  .section-title{
    font-size:14px; color:var(--ink-soft); font-weight:700;
    margin:0 0 14px; display:flex; align-items:center; gap:8px;
  }
  .section-title .bar{width:4px;height:14px;background:var(--red);border-radius:2px;display:inline-block}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  @media (max-width:420px){ .grid{grid-template-columns:1fr} }

  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    text-align:right;
    cursor:pointer;
    display:flex; flex-direction:column; gap:6px;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    text-decoration:none;
    color:var(--ink);
  }
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow); border-color:#D8C7AA}
  .card .emoji{font-size:26px}
  .card .name{font-family:'Reem Kufi',sans-serif; font-size:16px; font-weight:700}
  .card .desc{font-size:12.5px; color:var(--ink-soft)}
  .card .badge{
    align-self:flex-start;
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px;
    margin-top:2px;
  }
  .badge.high{background:var(--green-soft); color:var(--green)}
  .badge.partial{background:var(--amber-soft); color:var(--amber)}
  .badge.low{background:#FBE4E1; color:var(--red-deep)}

  .card.soon{
    background:var(--gray-soft); border-style:dashed; cursor:default; opacity:.75;
  }
  .card.soon:hover{transform:none; box-shadow:none}
  .card.soon .name{color:var(--ink-soft)}

  footer.sitefoot{
    padding:26px 0 50px; text-align:center; color:var(--ink-soft); font-size:12.5px;
  }
  footer.sitefoot nav a:hover{color:var(--red)}

  /* ===== Service flow ===== */
  .flowhead{
    display:flex; align-items:center; gap:10px; padding:18px 0 6px;
  }
  .backbtn{
    border:1px solid var(--line); background:#fff; border-radius:10px;
    width:36px;height:36px; display:flex; align-items:center; justify-content:center;
    font-size:16px; cursor:pointer;
  }
  .flow-title{display:flex; align-items:center; gap:10px}
  .flow-title .emoji{font-size:22px}
  .flow-title .name{font-family:'Reem Kufi',sans-serif; font-size:18px}

  .progress{display:flex; gap:6px; margin:18px 0 22px}
  .progress .dot{height:5px; flex:1; border-radius:3px; background:var(--line)}
  .progress .dot.done{background:var(--red)}

  .question{font-size:19px; font-weight:700; margin:0 0 16px}
  .options{display:flex; flex-direction:column; gap:10px}
  .opt{
    background:#fff; border:1.5px solid var(--line); border-radius:12px;
    padding:15px 16px; font-size:15.5px; text-align:right; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
  }
  .opt:hover{border-color:var(--red); background:#FFF6F5}
  .opt .arrow{opacity:.4; font-size:13px}

  /* ===== Checklist result ===== */
  .result-top{
    background:var(--green-soft); border:1px solid #CFE6D9; border-radius:var(--radius);
    padding:16px; display:flex; gap:12px; align-items:flex-start; margin-bottom:20px;
  }
  .result-top.partial{background:var(--amber-soft); border-color:#EFD9A6}
  .result-top.low{background:#FBE4E1; border-color:#F0C0BC}
  .result-top .dot-status{font-size:18px}
  .result-top .txt{font-size:13.5px; color:var(--ink)}
  .result-top .txt b{display:block; margin-bottom:2px}

  .checklist{list-style:none; margin:0 0 22px; padding:0; display:flex; flex-direction:column; gap:10px}
  .checklist li{
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:13px 14px; display:flex; align-items:flex-start; gap:10px; font-size:14.5px;
  }
  .checklist li input{
    margin-top:3px; width:18px; height:18px; accent-color:var(--red); flex-shrink:0;
  }
  .checklist li.checked{opacity:.55; text-decoration:line-through}

  .note-box{
    background:var(--paper-alt); border:1px dashed #D8C7AA; border-radius:12px;
    padding:13px 14px; font-size:13px; color:var(--ink-soft); margin-bottom:22px;
  }

  .actions{display:flex; gap:10px; margin-bottom:26px}
  .btn{
    flex:1; border-radius:12px; padding:13px; font-size:14.5px; font-weight:700;
    border:none; cursor:pointer; text-align:center;
  }
  .btn.primary{background:var(--red); color:#fff}
  .btn.ghost{background:#fff; border:1.5px solid var(--line); color:var(--ink)}

  .source-line{
    font-size:12px; color:var(--ink-soft); text-align:center; padding-bottom:10px;
  }
  .source-line a{color:var(--red); text-decoration:none}

  /* ===== Print ===== */
  @media print{
    header.hero, .backbtn, .actions, .searchbox, footer.sitefoot, .progress{display:none !important}
    body{background:#fff}
    .checklist li{border:1px solid #ccc}
    .badge, .result-top{-webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact}
  }

  [hidden]{display:none !important}
</style>
</head>
<body>

<div id="app" role="main" aria-live="polite"></div>

<script>
/* ============ بيانات الخدمات ============ */
const SERVICES = {
  passeport: {
    id:'passeport', emoji:'🛂', name:'جواز السفر البيومتري',
    desc:'أول مرة، تجديد، أو ضياع', confidence:'high',
    verified:'17 سبتمبر 2026',
    source:{name:'passeport.ma', url:'https://www.passeport.ma/ar/Home/PiecesAuMaroc'},
    steps:[
      {id:'who', q:'من أنت؟', options:[{v:'adult',l:'راشد (18 سنة فما فوق)'},{v:'minor',l:'قاصر'}]},
      {id:'type', q:'نوع الطلب', showIf:{who:'adult'},
        options:[{v:'first',l:'أول مرة'},{v:'renew',l:'تجديد'},{v:'lost',l:'ضياع أو سرقة'}]}
    ],
    documents(a){
      if(a.who==='minor'){
        return [
          'استمارة الطلب موقعة من أحد الوالدين أو النائب الشرعي',
          'نسخة من البطاقة الوطنية لأحد الوالدين المغربيين (أو الوثيقة المعادلة لغير المغربي)',
          'نسخة من شهادة الازدياد أو الحالة المدنية للقاصر',
          'صورة فوتوغرافية حديثة، خلفية بيضاء أو زرقاء أو رمادية، مقاس 45×35 ملم'
        ];
      }
      const d = [
        'استمارة طلب جواز السفر البيومتري، معبأة ومؤرخة وموقعة إلكترونياً عبر passeport.ma',
        'نسخة من البطاقة الوطنية للتعريف الإلكترونية سارية الصلاحية',
        'صورة فوتوغرافية حديثة، خلفية بيضاء أو زرقاء أو رمادية، مقاس 45×35 ملم',
        'وصل أداء واجبات التمبر الإلكتروني (500 درهم)'
      ];
      if(a.type==='renew') d.push('الجواز القديم، أو ما يثبت مصيره إن لم يعد متوفراً');
      if(a.type==='lost') d.push('شهادة تصريح بالضياع أو السرقة تتضمن رقم الجواز، من الأمن الوطني أو الدرك الملكي إن وقع الحادث بالمغرب، أو من الجهات الأمنية أو السفارة إن وقع بالخارج');
      return d;
    }
  },

  cnie: {
    id:'cnie', emoji:'🪪', name:'البطاقة الوطنية للتعريف',
    desc:'أول مرة، تجديد، ضياع، أو تغيير معطيات', confidence:'high',
    verified:'17 سبتمبر 2026',
    source:{name:'service-public.ma (البوابة الرسمية للخدمات العمومية)', url:'https://www.service-public.ma/ar/home'},
    steps:[
      {id:'type', q:'نوع الطلب', options:[
        {v:'first',l:'أول مرة'},{v:'renew',l:'تجديد (انتهاء الصلاحية)'},
        {v:'lost',l:'ضياع، سرقة، أو تلف'},{v:'change',l:'تغيير معطيات (الاسم، العنوان...)'}
      ]}
    ],
    documents(a){
      if(a.type==='first'){
        return [
          'شهادة الإقامة، تسلمها حسب الاختصاص الترابي مصالح الأمن الوطني أو الدرك الملكي، وفي حالة عدم وجودها السلطة الإدارية المحلية',
          'أربع صور فوتوغرافية للتعريف متشابهة، بالألوان، حديثة، أمامية، بخلفية فاتحة، مقاس 3.5×4.5 سم، بوجه مكشوف وبدون نظارات قاتمة',
          'شهادة الجنسية المغربية — تُطلب فقط إذا وقع شك في جنسية طالب البطاقة'
        ];
      }
      if(a.type==='renew'){
        return [
          'البطاقة الوطنية القديمة التي بحوزتك (تُسترجَع)',
          'شهادة الإقامة، من مصالح الأمن الوطني أو الدرك الملكي، أو السلطة الإدارية المحلية عند عدم وجودها',
          'صورتان فوتوغرافيتان للتعريف حديثتان، بالألوان، مقاس 3.5×4.5 سم، بخلفية فاتحة اللون'
        ];
      }
      if(a.type==='lost'){
        return [
          'تصريح بالشرف بالضياع أو السرقة أو التلف',
          'شهادة الإقامة، من مصالح الأمن الوطني أو الدرك الملكي، أو السلطة الإدارية المحلية عند عدم وجودها',
          'صورتان فوتوغرافيتان للتعريف حديثتان، مقاس 3.5×4.5 سم'
        ];
      }
      return [
        'وثيقة تثبت التغيير المطلوب (مثلاً: حكم بتصحيح الاسم، أو عقد الزواج في حالة تغيير اللقب)',
        'وثيقة السكن الجديد، في حالة تغيير العنوان',
        'حضور النائب الشرعي مع نسخة من بطاقته ووثيقة تثبت صفته، إن كان المعني بالأمر قاصراً'
      ];
    },
    note:'حالة "تغيير المعطيات" أقل توثيقاً رسمياً من باقي الحالات — الوثيقة الدقيقة تعتمد على نوع التغيير نفسه، فيُنصح بالتأكد من مركز البطاقة الوطنية قبل التنقل.'
  },

  casier: {
    id:'casier', emoji:'📄', name:'السجل العدلي',
    desc:'مستخرج السوابق القضائية', confidence:'high',
    verified:'17 سبتمبر 2026',
    source:{name:'casierjudiciaire.justice.gov.ma', url:'https://casierjudiciaire.justice.gov.ma/'},
    steps:[
      {id:'birth', q:'مكان الازدياد', options:[{v:'ma',l:'بالمغرب'},{v:'abroad',l:'خارج المغرب'}]},
      {id:'method', q:'طريقة الاستلام', options:[
        {v:'email',l:'بريد إلكتروني (مجاني)'},
        {v:'post',l:'بريد مضمون (25 أو 40 درهم)'},
        {v:'court',l:'سحب من المحكمة'}
      ]}
    ],
    documents(a){
      const d = [
        'نسخة من البطاقة الوطنية للتعريف الإلكترونية سارية الصلاحية',
        'تعبئة استمارة الطلب الإلكترونية بدقة (نفس معطيات البطاقة الوطنية)'
      ];
      if(a.method==='email') d.push('بطاقة CNIE من الجيل الجديد ضرورية لاستلام الوثيقة عبر البريد الإلكتروني');
      if(a.method==='post') d.push('عنوان بريدي دقيق لتوصيل الوثيقة (25 درهم داخل المغرب، 40 درهم خارجه)');
      if(a.birth==='abroad') d.push('الطلب يُعالج من طرف مصلحة السجل العدلي الوطني بوزارة العدل (وليس محكمة مكان الازدياد)');
      return d;
    }
  },

  sokna: {
    id:'sokna', emoji:'🏠', name:'شهادة السكنى',
    desc:'من السلطات المحلية أو الشرطة', confidence:'high',
    verified:'17 سبتمبر 2026',
    source:{name:'service-public.ma (البوابة الرسمية للخدمات العمومية)', url:'https://www.service-public.ma/ar/home'},
    steps:[
      {id:'authority', q:'الجهة المصدرة', options:[
        {v:'local',l:'السلطات المحلية (قيادة / ملحقة / مقاطعة)'},
        {v:'police',l:'دائرة الشرطة (شهادة الإقامة لأغراض إدارية)'}
      ]}
    ],
    documents(a){
      if(a.authority==='police'){
        return [
          'التوجه شخصياً لدائرة الشرطة المختصة ترابياً بمكان السكن — تُسلَّم في نفس يوم تقديم الطلب',
          'ما يثبت محل الإقامة: شهادة الملكية، أو وصل أداء فاتورة الماء أو الكهرباء أو الهاتف، أو عقد الكراء، أو التزام صاحب السكنى'
        ];
      }
      return [
        'تعبئة مطبوع خاص، موضوع رهن إشارة المواطنين بالقيادة أو الملحقة الإدارية',
        'إحدى الوثائق التالية: آخر فاتورة أداء واجبات الماء أو الكهرباء، أو فاتورة الهاتف الثابت باسم طالب الشهادة، أو شهادة الملكية، أو نسخة من عقد الكراء، أو توصيل الكراء، أو التزام مصادق عليه من صاحب المسكن'
      ];
    },
    note:'شهادة السكنى من السلطات المحلية وشهادة الإقامة من الشرطة وثيقتان رسميتان مختلفتان (مبنيتان على دورية الأمن الوطني عدد 3166 لسنة 2003)، ويُطلب أحياناً استعمال إحداهما دون الأخرى حسب الجهة الطالبة (مثلاً CNIE تقبل الاثنتين) — يستحسن التأكد من الجهة التي تطلب الشهادة أي نوع بالضبط تريد.'
  },

  permis: {
    id:'permis', emoji:'🚗', name:'رخصة السياقة',
    desc:'أول مرة أو تجديد', confidence:'high',
    verified:'17 سبتمبر 2026',
    source:{name:'NARSA', url:'https://khadamatnarsa.ma/ar/services/obtention-de-mon-permis-de-conduire-1ere-fois'},
    steps:[
      {id:'type', q:'نوع الطلب', options:[
        {v:'first',l:'أول مرة'},{v:'renew',l:'تجديد (تلف أو انتهاء صلاحية)'},{v:'lost',l:'نظير (ضياع أو سرقة)'}
      ]}
    ],
    documents(a){
      const d = [
        'نسخة من البطاقة الوطنية للتعريف أو جواز السفر المغربي ساري الصلاحية',
        'وصل أداء الرسوم وواجبات التمبر',
        'شهادة طبية لا تتجاوز 3 أشهر، من طبيب معترف به',
        'صورتان فوتوغرافيتان حديثتان، مقاس 45×35 ملم'
      ];
      if(a.type==='first'){
        d.unshift('استمارة "طلب اجتياز امتحان رخصة السياقة" معبأة وموقعة');
        d.push('شهادة إتمام التكوين من مؤسسة تعليم السياقة مرخصة');
      }
      if(a.type==='renew') d.unshift('استمارة "طلب تجديد أو نظير رخصة السياقة" معبأة وموقعة');
      if(a.type==='lost') d.unshift('استمارة "طلب تجديد أو نظير رخصة السياقة" معبأة وموقعة');
      return d;
    },
    note: 'الرسوم: 400 درهم. في حال عدم احترام الأجل القانوني: غرامة 200 درهم + زيادة 10% من مبلغ الغرامة عن كل شهر تأخير. حالة "نظير" (ضياع/سرقة): وجوب إرفاق تصريح رسمي بالضياع أو السرقة غير مؤكد بشكل كامل من المصادر — يُستحسن التأكد عند مركز تسجيل السيارات.'

  nazirrasmaqari: {

    verified:'19 سبتمبر 2026',
    source:{name:'ANCFCC (الوكالة الوطنية للمحافظة العقارية والمسح العقاري والخرائطية)', url:'https://www.ancfcc.gov.ma/ar'},
    steps:[
      {id:'case', q:'سبب الطلب', options:[

          'نسخة مطابقة للأصل من البطاقة الوطنية للتعريف',

      return [
        'تصريح يتضمن هوية المالك وظروف الضياع أو السرقة أو التدمير',

        'تصريح بالضياع أو السرقة لدى السلطات المختصة (الأمن الوطني أو الدرك الملكي)',

  },

  rafiarrahn: {
    id:'rafiarrahn', emoji:'🔓', name:'رفع الرهن عن العقار',

    source:{name:'ANCFCC (الوكالة الوطنية للمحافظة العقارية والمسح العقاري والخرائطية)', url:'https://www.ancfcc.gov.ma/ar'},
    steps:[],
    documents(){
      return [

      ];
    },
    note:'يُقدَّم الملف لدى المحافظة العقارية التي يتبعها العقار، بعد الحصول أولاً على عقد رفع اليد من البنك أو المؤسسة الدائنة عقب تصفية القرض بالكامل. الوجيبات تُؤدى بصندوق المحافظة العقارية عند الإيداع.'
  },

  tasmimaqari: {
    id:'tasmimaqari', emoji:'🗺️', name:'التصميم العقاري',
    desc:'مخطط دقيق لحدود العقار ومساحته', confidence:'partial',
    verified:'19 سبتمبر 2026',
    source:{name:'ANCFCC (الوكالة الوطنية للمحافظة العقارية والمسح العقاري والخرائطية)', url:'https://www.ancfcc.gov.ma/PlanCadastralAr'},
    steps:[],
    documents(){
      return [
        'رقم الرسم العقاري أو مرجع طلب التحفيظ الخاص بالعقار',
        'تعبئة استمارة الطلب الإلكترونية المخصصة عبر بوابة ANCFCC',
        'أداء الوجيبات المستحقة إلكترونياً عند تقديم الطلب'
      ];
    },
    note:'الطلب يتم بالكامل عن بعد عبر بوابة ANCFCC، مع تتبع حالة الملف باستعمال رمز يُرسَل بعد الأداء. تفاصيل الوثائق الشخصية المطلوبة بالضبط (كنوع الهوية أو معلومات الاتصال الإضافية) غير موضحة بشكل كامل في المصادر المتاحة لنا، لذلك ثقتنا في هذه الخدمة جزئية.'
  }
};

const SOON = [];

/* ============ منطق التطبيق ============ */
const app = document.getElementById('app');
let currentAnswers = {};

function badgeHtml(confidence){
  if(confidence==='high') return '<span class="badge high">🟢 موثق بالكامل</span>';
  if(confidence==='low') return '<span class="badge low">🔴 يتغير كثيراً</span>';
  return '<span class="badge partial">🟡 موثق جزئياً</span>';
}
function statusEmoji(confidence){
  if(confidence==='high') return '🟢';
  if(confidence==='low') return '🔴';
  return '🟡';
}
function statusLabel(confidence){
  if(confidence==='high') return 'قائمة موثقة بالكامل';
  if(confidence==='low') return 'قائمة عامة جداً — تختلف كل سنة ولكل مؤسسة، تحقق دائماً قبل الاعتماد عليها';
  return 'قائمة موثقة جزئياً — تحقق قبل الإيداع';
}

function renderHome(){
  app.innerHTML = `
    <header class="hero">
      <div class="wrap hero-inner">
        <div class="brand"><span class="star">★</span> ملفك جاهز؟</div>
        <h1>اعرف وثائقك قبل ما تدوز للإدارة</h1>
        <p class="tagline">اختر الخدمة، أجب عن سؤالين، واحصل على قائمة الوثائق الخاصة بحالتك بدقة.</p>
        <div class="searchbox">
          <span class="icon">🔍</span>
          <input id="searchInput" type="text" inputmode="search" autocomplete="off" aria-label="ابحث عن خدمة" placeholder="جواز السفر، الزواج، رخصة السياقة…">
        </div>
      </div>
    </header>
    <main class="wrap">
      <div class="section-title"><span class="bar"></span> الخدمات المتوفرة</div>
      <div class="grid" id="grid"></div>

      ${SOON.length ? `
      <div style="height:28px"></div>
      <div class="section-title"><span class="bar"></span> قريباً</div>
      <div class="grid">
        ${SOON.map(s => `
          <div class="card soon">
            <div class="emoji" aria-hidden="true">${s.emoji}</div>
            <div class="name">${s.name}</div>
          </div>
        `).join('')}
      </div>` : ''}
    </main>
    <footer class="sitefoot">
      <nav style="display:flex; gap:16px; justify-content:center; margin-bottom:10px">
        <a href="index.html" style="color:var(--ink-soft); text-decoration:none; font-size:13px">الرئيسية</a>
        <a href="about.html" style="color:var(--ink-soft); text-decoration:none; font-size:13px">من نحن</a>
        <a href="privacy.html" style="color:var(--ink-soft); text-decoration:none; font-size:13px">سياسة الخصوصية</a>
        <a href="contact.html" style="color:var(--ink-soft); text-decoration:none; font-size:13px">اتصل بنا</a>
      </nav>
      ملفك جاهز؟ — معلومات مبنية على مصادر رسمية، بدون ضمان قانوني. تحقق دائماً من المصدر قبل الاعتماد النهائي.
    </footer>
  `;
  window.scrollTo(0,0);

  renderGrid('');
  document.getElementById('searchInput').addEventListener('input', e => renderGrid(e.target.value));
}

function renderGrid(filter){
  const q = filter.trim().toLowerCase();
  const list = Object.values(SERVICES).filter(s => !q || s.name.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q));
  const grid = document.getElementById('grid');
  grid.innerHTML = list.map(s => `
    <button type="button" class="card" data-id="${s.id}" aria-label="${s.name} — ${s.desc}">
      <div class="emoji" aria-hidden="true">${s.emoji}</div>
      <div class="name">${s.name}</div>
      <div class="desc">${s.desc}</div>
      ${badgeHtml(s.confidence)}
    </button>
  `).join('') || '<p style="color:var(--ink-soft);font-size:14px">لم يتم العثور على نتائج لهذا البحث.</p>';

  grid.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=> startService(card.dataset.id));
  });
}

function startService(id){
  currentAnswers = {};
  location.hash = '#/' + id;
  renderStep(id, 0);
}

function visibleSteps(service, answers){
  return service.steps.filter(st => !st.showIf || Object.entries(st.showIf).every(([k,v])=>answers[k]===v));
}

function renderStep(id, index){
  const service = SERVICES[id];
  const steps = visibleSteps(service, currentAnswers);
  if(index >= steps.length){ renderResult(id); return; }
  const step = steps[index];

  app.innerHTML = `
    <div class="wrap">
      <div class="flowhead">
        <button type="button" class="backbtn" id="backBtn" aria-label="رجوع">→</button>
        <div class="flow-title"><span class="emoji" aria-hidden="true">${service.emoji}</span><span class="name">${service.name}</span></div>
      </div>
      <div class="progress" role="progressbar" aria-valuenow="${index+1}" aria-valuemin="1" aria-valuemax="${steps.length}" aria-label="السؤال ${index+1} من ${steps.length}">
        ${steps.map((_,i)=>`<div class="dot ${i<=index ? 'done' : ''}"></div>`).join('')}
      </div>
      <div class="question">${step.q}</div>
      <div class="options">
        ${step.options.map(o=>`<button type="button" class="opt" data-v="${o.v}">${o.l}<span class="arrow" aria-hidden="true">◀</span></button>`).join('')}
      </div>
    </div>
  `;
  window.scrollTo(0,0);

  document.getElementById('backBtn').addEventListener('click', ()=>{
    if(index===0){ location.hash=''; renderHome(); }
    else renderStep(id, index-1);
  });
  document.querySelectorAll('.options .opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      currentAnswers[step.id] = opt.dataset.v;
      renderStep(id, index+1);
    });
  });
}

function renderResult(id){
  const service = SERVICES[id];
  const docs = service.documents(currentAnswers);
  const storageKey = 'mlk_' + id + '_' + JSON.stringify(currentAnswers);
  let checked = {};
  try{ checked = JSON.parse(localStorage.getItem(storageKey) || '{}'); }catch(e){}

  app.innerHTML = `
    <div class="wrap">
      <div class="flowhead">
        <button type="button" class="backbtn" id="backBtn" aria-label="رجوع">→</button>
        <div class="flow-title"><span class="emoji" aria-hidden="true">${service.emoji}</span><span class="name">${service.name}</span></div>
      </div>

      <div class="result-top ${service.confidence}">
        <div class="dot-status">${statusEmoji(service.confidence)}</div>
        <div class="txt">
          <b>${statusLabel(service.confidence)}</b>
          ${docs.length ? `عدد الوثائق: ${docs.length} — آخر تحقق: ${service.verified}` : `آخر تحقق: ${service.verified}`}
        </div>
      </div>

      ${docs.length ? `
      <ul class="checklist" id="checklist">
        ${docs.map((d,i)=>`
          <li class="${checked[i]?'checked':''}">
            <input type="checkbox" data-i="${i}" ${checked[i]?'checked':''}>
            <span>${d}</span>
          </li>
        `).join('')}
      </ul>` : ''}

      ${service.note ? `<div class="note-box">ℹ️ ${service.note}</div>` : ''}

      <div class="actions">
        <button class="btn primary" id="printBtn">🖨️ طباعة / حفظ PDF</button>
        <button class="btn ghost" id="restartBtn">🔄 ابدأ من جديد</button>
      </div>

      <div class="source-line">
        المصدر: ${service.source.url ? `<a href="${service.source.url}" target="_blank" rel="noopener noreferrer">${service.source.name}</a>` : service.source.name}
      </div>
    </div>
  `;
  window.scrollTo(0,0);

  document.getElementById('backBtn').addEventListener('click', ()=>{ location.hash=''; renderHome(); });
  document.getElementById('restartBtn').addEventListener('click', ()=> startService(id));
  document.getElementById('printBtn').addEventListener('click', ()=> window.print());

  document.querySelectorAll('#checklist input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      checked[cb.dataset.i] = cb.checked;
      cb.closest('li').classList.toggle('checked', cb.checked);
      try{ localStorage.setItem(storageKey, JSON.stringify(checked)); }catch(e){}
    });
  });
}

/* ============ تشغيل ============ */
function boot(){
  const hash = location.hash.replace('#/','');
  if(hash && SERVICES[hash]){
    currentAnswers = {};
    renderStep(hash, 0);
  } else {
    renderHome();
  }
}
window.addEventListener('hashchange', boot);
boot();
</script>
</body>
</html>
